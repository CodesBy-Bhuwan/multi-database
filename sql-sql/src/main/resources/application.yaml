spring:

  datasource:
    mysql:
      jdbc-url: jdbc:mysql://localhost:3306/user_db
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

    postgres:
      jdbc-url: jdbc:postgresql://localhost:5432/product_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  # Postgresql is to store only product details and mysql for user details

  flyway:
    enabled: false